<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión Eventos Deportivos</title>
    <link rel="stylesheet" href="style.css">
</head> 
<body> 
    <section id="pantalla-inicio" class="hero">
        
        <header class="header-landing">
            <div class="botones-auth">
                <button id="btn-nav-registrarse" class="btn-transparente">Registrarse</button>
                <button id="btn-nav-login" class="btn-color">Iniciar Sesión</button>
            </div>
        </header>

        <div class="overlay"></div>
        <div class="contenido-hero">
            <h1>Eventos Deportivos </h1>
            <p>Conectá, gestioná y potenciá tu club con las herramientas más avanzadas.</p>
            <button id="btn-comenzar" class="btn-principal">Comenzar</button>
        </div>
    </section>

    <section id="seccion-login" class="contenedor-login" style="display: none;">
        <div class="caja-login">
            <h2>Acceso al Sistema</h2>
            <form id="formulario-login">
                <div class="grupo-input">
                    <label for="email_login">Email</label>
                    <input type="email" id="email_login" placeholder="Ingresar un email" required>
                </div>
                <div class="grupo-input">
                    <label for="password_login">Contraseña</label>
                    <input type="password" id="password_login" placeholder="Tu contraseña" required>
                </div>
                <button type="submit" id="btn-ingresar">Ingresar al Panel</button>
            </form>
        </div>
    </section>

    <section id="seccion-registro" class="contenedor-login" style="display: none;">
        <div class="caja-login">
            <h2>Crear Cuenta Nueva</h2>
            <form id="formulario-registro">
                <div class="grupo-input">
                    <label for="nombre_registro">Nombre</label>
                    <input type="text" id="nombre_registro" placeholder="Ej: Maxi" required>
                </div>
                <div class="grupo-input">
                    <label for="email_registro">Email</label>
                    <input type="email" id="email_registro" placeholder="maxi@gmail.com" required>
                </div>
                <div class="grupo-input">
                    <label for="password_registro">Contraseña</label>
                    <input type="password" id="password_registro" placeholder="Creá una contraseña" required>
                </div>
                <button type="submit">Registrarme</button>
                <button type="button" id="btn-volver-registro" style="background-color: #95a5a6; margin-top: 10px;">Volver al Inicio</button>
            </form>
        </div>
    </section>

    <div id="app-principal" style="display: none;">
        <div class="contenedor-principal">
            <header>
                <h1>Eventos Deportivos</h1>
                <div class="nav-admin">
                    <button id="btn-ver-cartelera" class="btn-nav">Ver Cartelera</button>
                    <button id="btn-ir-cargar" class="btn-nav">Cargar Partido</button>
                    <button id="btn-logout" class="btn-salir">Cerrar Sesión</button>
                </div>
            </header>

            <main>
                <section id="vista-formulario" class="seccion formulario" style="display: none;">
                    <h2>Agregar Nuevo Partido</h2>
                    <form id="formulario-evento">
                        <div class="grupo-input">
                            <label for="titulo">Título del Partido</label>
                            <input type="text" id="titulo" placeholder="Ej: Final Relámpago">
                        </div> 
                        <div class="grupo-input">
                            <label for="id_categoria">ID Categoría</label>
                            <input type="number" id="id_categoria" placeholder="Ej: 1">
                        </div>
                        <div class="grupo-input">
                            <label for="fecha">Fecha y Hora</label>
                            <input type="datetime-local" id="fecha" required>
                        </div>
                        <div class="grupo-input">
                            <label for="estadio">Estadio/Cancha</label>
                            <input type="text" id="estadio" placeholder="Ej: Complejo 1">      
                        </div>
                        <div class="grupo-input">
                            <label for="capacidad_max">Capacidad Máxima</label>
                            <input type="number" id="capacidad_max" required>
                        </div>
                        <div class="grupo-input">
                            <label for="entradas_disp">Entradas Disponibles</label>
                            <input type="number" id="entradas_disp" required>
                        </div>
                        <button type="submit" id="btn-guardar">Guardar Partido</button>
                    </form>
                </section>

                <section id="vista-cartelera" class="seccion-cartelera">
                    <h2>Cartelera Actual</h2>
                    <div id="contenedor-eventos" class="grilla-eventos">
                        <p class="cargando">Cargando partidos...</p>
                    </div>
                </section>
            </main> 

            <footer>
                <p>Sistema de Gestión de Eventos | Desarrollado por Maximiliano Rodríguez</p>
            </footer>
        </div>
    </div>
   
    <script src="app.js"></script> 
</body>
</html>
