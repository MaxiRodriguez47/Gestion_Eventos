<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion eventos deportivos</title>
    <link rel="stylesheet" href="style.css">
</head> 
<body> 
    <div class="contenedor-principal">
        <header>
            <h1>Torneos Relampagos</h1>
            <p>Panel de administracion de eventos deportivos</p>
        </header>
        <main>
            <section class="seccion formulario">
                <h2>Agregar Nuevo Partido</h2>
                <form id="formulario-evento">
                    <div class="grupo-iput">
                        <label for="titulo">Titulo del Partido</label>
                        <input type="text" id="titulo" placeholder="Ej Final Relampago ">
                    </div> 
                    <div class="grupo-iput">
                        <label for="id_categoria">ID Categoria</label>
                        <input type="number" id="id_categoria" placeholder="Ej:1">
                    </div>
                    <div class="grupo-iput">
                        <label for="fecha">Fecha y Hora</label>
                        <input type="datetime-local" id="fecha" required>
                    </div>
                    <div class="grupo-iput">
                        <label for="estadio">Estadio/Cancha</label>
                        <input type="text" id="estadio" placeholder="Ej Cancha">      
                    </div>
                    <div class="grupo-iput">
                        <label for="capacidad_max">Capacidad Maxima</label>
                        <input type="number" id="capacidad_max" required>
                    </div>
                    <div class="grupo-iput">
                        <label for="entradas_disp">Entradas Disponibles</label>
                        <input type="number" id="entradas_disp" required>
                    </div>
                    <button type="submit" id="btn-guardar"> Guardar Partidos</button>
                </form>
            </section>

            <section class="seccion-cartelera">
                <h2>Cartelera Actual</h2>
                <div id="contenedor-eventos" class="grilla-eventos">
                    <p class="cargando">Cargando partidos...</p>
                </div>
            </section>
        </main>
    <div> 
   
       <script src="app.js"></script> 
</body>
</html>
